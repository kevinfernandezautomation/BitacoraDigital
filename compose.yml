services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8000']
    volumes: [media:/app/private]
volumes:
  pgdata:
  media:
